name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python3 scripts/collect.py --selftest
      - run: python3 scripts/draft.py --selftest
      - run: python3 scripts/build-share.py && git diff --exit-code share/data.js  # data.js must match data.json
      - run: node --check share/app.js
      - run: bash -n scripts/run-weekly.sh
